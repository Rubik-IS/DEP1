<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="rubik-cyber" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="rubik-offset" x1="36" y1="36" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>
  <!-- Background Deep Void Rounded Square -->
  <rect width="64" height="64" rx="14" fill="#080D1A" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.5" />

  <!-- Row 1 -->
  <rect x="10" y="10" width="12" height="12" rx="3" fill="url(#rubik-cyber)" />
  <rect x="25" y="10" width="12" height="12" rx="3" fill="url(#rubik-cyber)" />
  <rect x="40" y="10" width="12" height="12" rx="3" fill="url(#rubik-cyber)" />

  <!-- Row 2 -->
  <rect x="10" y="25" width="12" height="12" rx="3" fill="url(#rubik-cyber)" />
  <rect x="25" y="25" width="12" height="12" rx="3" fill="#38BDF8" />
  <rect x="40" y="25" width="12" height="12" rx="3" fill="url(#rubik-cyber)" />

  <!-- Row 3 (with iconic offset bottom-right block) -->
  <rect x="10" y="40" width="12" height="12" rx="3" fill="url(#rubik-cyber)" />
  <rect x="25" y="40" width="12" height="12" rx="3" fill="url(#rubik-cyber)" />
  <rect x="43" y="43" width="12" height="12" rx="3" fill="url(#rubik-offset)" stroke="#7DD3FC" stroke-width="1" />
</svg>
