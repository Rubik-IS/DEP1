name: CI – Build & Quality Validation

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Typecheck, Unit, Integration, Security & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (clean lockfile install)
        run: npm ci

      - name: TypeScript static check
        run: npm run lint

      - name: Unit & Integration tests
        run: npm run test:unit && npm run test:integration

      - name: Security audit
        run: npm run test:security

      - name: Production build
        run: npm run build

      - name: Verify build output & SPA fallback
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml

      - name: Upload production dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dep1-dist
          path: dist/

  browser-quality:
    name: E2E, Accessibility, SEO & Analytics
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download production dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dep1-dist
          path: dist/

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E, Accessibility, SEO & Analytics suites
        run: npm run test:e2e && npm run test:accessibility && npm run test:seo && npm run test:analytics

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-report
          path: tests/reports/
