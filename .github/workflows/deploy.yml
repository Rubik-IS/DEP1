name: Deploy – GitHub Pages Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Quality Gates & Production Build
    runs-on: ubuntu-latest
    outputs:
      base_path: ${{ steps.pages.outputs.base_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages & resolve base path
        id: pages
        uses: actions/configure-pages@v5

      - name: Run TypeScript, Unit, Integration & Security gates
        run: |
          npm run lint
          npm run test:unit
          npm run test:integration
          npm run test:security

      - name: Build production static bundle for verification
        env:
          VITE_BASE_PATH: /
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E, Accessibility, SEO & Analytics gates against built dist
        run: npm run test:e2e && npm run test:accessibility && npm run test:seo && npm run test:analytics

      - name: Build final GitHub Pages static bundle (with resolved repository base path)
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || (steps.pages.outputs.base_path != '' && format('{0}/', steps.pages.outputs.base_path) || '/') }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
        run: npm run build

      - name: Verify required static outputs
        run: |
          test -f dist/index.html
          test -f dist/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
